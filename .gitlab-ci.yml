stages:
  - check
  - deploy

# Every link and image in the docs points inside this repository, so a broken
# path is the only way these pages can regress.
check_links:
  stage: check
  image: alpine:3.20
  tags: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
  script:
    - apk add --no-cache python3
    - python3 .gitlab/ci/check_links.py

deploy_github:
  stage: deploy
  image: alpine:3.20
  tags: [build]
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"
  script:
    - apk add --no-cache git openssh-client
    - |
      # GH_KEY holds the private key base64 encoded, so it carries no
      # whitespace and can be masked.
      echo "$GH_KEY" | base64 -d > /tmp/deploy_key
      chmod 600 /tmp/deploy_key
    - export GIT_SSH_COMMAND="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new"
    - git clone --quiet "$CI_REPOSITORY_URL" /tmp/deploy
    - cd /tmp/deploy
    - git remote add gh git@github.com:espressif/esp-hosted.git
    - git push gh "${CI_COMMIT_SHA}:refs/heads/${CI_COMMIT_BRANCH}"
